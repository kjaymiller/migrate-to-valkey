[settings]
python.uv_venv_auto = "create|source"

[env]
_.path = ["./bin"]
PYTHONPATH = "."
SOURCE_CONNECTION_STRING = "{{ env.SOURCE_CONNECTION_STRING | default(value='valkey://localhost:6379') }}"
TARGET_CONNECTION_STRING = "{{ env.TARGET_CONNECTION_STRING | default(value='valkey://localhost:6379') }}"

[tasks."start-server"]
description = "Start the built-in Valkey server in the background (with modules loaded for testing)"
run = """
valkey-server --daemonize yes \
  --loadmodule /usr/lib/valkey/libvalkey_bloom.so \
  --loadmodule /usr/lib/valkey/libjson.so \
  --loadmodule /usr/lib/valkey/libsearch.so
"""

[tasks.compare]

description = "Run migration check (compares Source and Target)"
run = "uv run vk_migrate migration-check"

[tasks.check]
description = "Analyze the Source database to see if its data can be safely migrated to Target"
run = "uv run vk_migrate compatibility-check"

[tasks.flush]
description = "Flush a specific database by connection string (Usage: mise run flush <connection_string>)"
run = "uv run vk_migrate flush"

[tasks."flush-all"]
description = "Flush all data from both Source and Target databases"
run = "uv run vk_migrate flush-all"

[tasks."load-passing"]
description = "Load a passing dataset into Source"
run = "uv run vk_migrate load-fake-data --target \"$SOURCE_CONNECTION_STRING\" --scenario passing --force"

[tasks."check-passing"]
description = "Load passing dataset and run migration check"
run = ["mise run load-passing", "mise run compare"]

[tasks."load-failing"]
description = "Load a failing dataset (includes JSON) into Source"
run = "uv run vk_migrate load-fake-data --target \"$SOURCE_CONNECTION_STRING\" --scenario failing --force"

[tasks."check-failing"]
description = "Load failing dataset and run migration check"
run = ["mise run load-failing", "mise run compare"]

[tasks.examine]
description = "Examine all keys and their types extremely fast using Python pipelining"
run = "uv run vk_migrate examine"
